[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liverkg"
version = "0.1.0"
description = "Research-grade CLI for PubMed liver disease knowledge graph extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research use" }
authors = [
  { name = "LiverKG Contributors" }
]
dependencies = [
  "langextract==1.6.0",
  "google-genai",
  "openai>=1.40,<3",
  "neo4j",
  "requests",
  "typing_extensions",
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.0",
  "tomli-w>=1.0",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
liverkg = "liverkg_cli.app:main"

[tool.setuptools]
include-package-data = false
py-modules = ["convert_pubmed_xml_to_jsonl"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cognitive_agent*", "liverkg_cli*"]
