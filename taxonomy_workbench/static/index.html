<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>事件分类 · LiverKG</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/pipeline.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 6 17 11 8 18M7 6l1 12"/><g fill="currentColor" stroke="none"><circle cx="7" cy="6" r="2.4"/><circle cx="17" cy="11" r="2.4"/><circle cx="8" cy="18" r="2.4"/></g></svg></span>LiverKG</a>
    <nav class="flow-nav" aria-label="处理流程">
      <button type="button" data-stage="events"><span class="step-number">1</span>事件抽取</button>
      <span class="flow-arrow" aria-hidden="true">›</span>
      <button type="button" data-stage="concepts"><span class="step-number">2</span>概念化</button>
      <span class="flow-arrow" aria-hidden="true">›</span>
      <button type="button" data-stage="leaves"><span class="step-number">3</span>Leaf 归一化</button>
      <span class="flow-arrow" aria-hidden="true">›</span>
      <button type="button" data-stage="taxonomy" aria-current="step"><span class="step-number">4</span>层级归纳</button>
    </nav>
    <a class="subtle-link experiments-link" href="/experiments">实验记录</a>
  </header>
  <main class="workspace">
    <header class="page-heading">
      <div><h1 id="page-title">层级归纳</h1><p class="page-meta" id="page-meta">正在读取当前结果…</p></div>
      <a class="button" href="/api/pipeline/export" id="export" hidden>导出分类图</a>
    </header>
    <div class="error" id="error" role="alert" hidden></div>
    <section id="empty" class="empty" hidden>
      <h2>还没有层级归纳结果</h2>
      <p>完成一次归纳后，事件、概念和分类图会显示在这里。</p>
      <a class="button" href="/experiments">打开实验工作台</a>
    </section>
    <section id="taxonomy-view" class="taxonomy-layout" hidden aria-label="层级归纳结果">
      <div class="graph-workspace">
        <div class="graph-topline" id="legacy-graph-controls">
          <nav id="branches" class="branch-tabs" aria-label="分类分支"></nav>
          <button class="button quiet" type="button" id="show-intermediates" aria-pressed="false">中间概念 <span id="middle-count"></span></button>
        </div>
        <p id="run-note" class="run-note" hidden></p>
        <div class="branch-picker" id="branch-picker" hidden>
          <label for="branch-select">查看范围</label>
          <select id="branch-select"></select>
          <button class="button" type="button" id="back-to-overview" hidden>返回总览</button>
          <div class="graph-legend" id="branch-legend" aria-label="分类图图例">
            <span><i class="node-shape added-node-key" aria-hidden="true"></i>新增父类</span>
            <span>父类 → 子类</span>
            <span>关系待人工复核</span>
          </div>
        </div>
        <div class="unrooted-picker" id="unrooted-picker" hidden>
          <label for="unrooted-select">未连接的分支与概念</label>
          <select id="unrooted-select"></select>
          <span class="subtle" id="unrooted-count"></span>
        </div>
        <div id="middle-list" class="middle-list" hidden aria-label="生成的中间概念"></div>
        <section id="branch-overview" class="taxonomy-overview" aria-label="全部分支" hidden></section>
        <section id="isolated-overview" class="taxonomy-overview" aria-label="独立概念" hidden></section>
        <section id="excluded-overview" class="taxonomy-overview" aria-label="暂缓与撤下的概念" hidden></section>
        <div class="graph-surface" id="graph-surface">
          <div id="graph" class="graph" aria-label="父类到子类的分类关系"></div>
          <div class="graph-legend" id="legacy-graph-legend" aria-label="分类图图例">
            <span>父类 → 子类</span>
            <span><i class="node-key intermediate"></i>中间概念</span>
            <span><i class="line-key supported"></i>定义支持</span>
            <span><i class="line-key uncertain"></i>待复查</span>
            <span><i class="line-key issue"></i>有问题</span>
          </div>
        </div>
      </div>
      <aside class="inspector" id="graph-inspector" aria-label="概念定义、关系与证据"><div id="inspector-content" aria-live="polite"></div></aside>
    </section>
    <section id="records-view" class="records-layout" hidden aria-label="阶段数据">
      <div class="records-workspace">
        <div class="records-controls">
          <label class="search-field"><span class="sr-only">搜索当前阶段</span><input id="record-search" type="search" placeholder="搜索事件、概念或 PMID" autocomplete="off"></label>
          <label><span class="sr-only">按文献筛选</span><select id="article-select"><option value="">全部文献</option></select></label>
          <span class="subtle" id="result-count"></span>
        </div>
        <div class="record-list" id="record-list"></div>
      </div>
      <aside class="inspector" aria-label="条目定义与原文证据"><div id="record-detail"></div></aside>
    </section>
  </main>
  <script type="module" src="/pipeline.js"></script>
</body>
</html>
